/* â”€â”€ SIDEBAR ACTIVE SYNC (IntersectionObserver) â”€â”€ */
(function() {
  function initSidebarSync() {
    var pillLinks = document.querySelectorAll(
      '.sidebar-pill, .sidebar-nav a, .chapter-nav a, nav a[href^="#"], aside a[href^="#"]'
    );
    if (!pillLinks.length) return;
    var sections = document.querySelectorAll(
      '[id^="chapter"], [id^="module"], [id^="curriculum"], [id^="section-"], [id^="interview-questions"]'
    );
    if (!sections.length) return;
    function setActive(id) {
      pillLinks.forEach(function(link) {
        var href = link.getAttribute('href') || '';
        var match = href === '#' + id || href.endsWith('/' + '#' + id);
        link.classList.toggle('active', match);
      });
    }
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-15% 0px -65% 0px', threshold: 0 });
    sections.forEach(function(el) { io.observe(el); });
    pillLinks.forEach(function(link) {
      link.addEventListener('click', function() {
        var href = (link.getAttribute('href') || '').replace(/^.*#/, '');
        if (href) setActive(href);
      });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSidebarSync);
  } else {
    initSidebarSync();
  }
})();
</script>

(function SmartSearch() {

  // Build topic index from knowledge base (OS, ML, DBMS, CN)
  function getKBTopics() {
    var topics = [];

    kbs.forEach(function(name) {
      if (window[name] && Array.isArray(window[name])) {

  // Fuzzy match scorer
  function score(query, text) {
    var q = query.toLowerCase().trim();
    var t = text.toLowerCase();
    if (t === q) return 100;
    if (t.startsWith(q)) return 80;
    if (t.includes(q)) return 60;
    var words = q.split(/\s+/);
    var wordScore = words.reduce(function(acc, w) { return acc + (t.includes(w) ? 20 : 0); }, 0);
    return wordScore;
  }

  // Highlight matches in page content
  function clearHighlights() {
    highlights.forEach(function(el) {

  function highlightInPage(query) {
    clearHighlights();
    if (!query || query.length < 2) return;
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
        var parent = node.parentNode;
        if (!parent) return NodeFilter.FILTER_REJECT;
        var tag = parent.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'INPUT' || tag === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
        if (parent.classList && (parent.classList.contains('chat-messages') || parent.classList.contains('smart-search-wrapper') || parent.classList.contains('search-autocomplete'))) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) { nodes.push(walker.currentNode); }
    var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    nodes.forEach(function(node) {
      if (!re.test(node.textContent)) return;
      var frag = document.createDocumentFragment();
      var parts = node.textContent.split(re);
      parts.forEach(function(p) {
        if (re.test(p)) {
          var mark = document.createElement('mark');
          mark.className = 'search-highlight';
          mark.textContent = p;
          frag.appendChild(mark);
          highlights.push(mark);
        } else {
          frag.appendChild(document.createTextNode(p));
        }
        re.lastIndex = 0;
      });
      node.parentNode.replaceChild(frag, node);
    });
    // Scroll to first highlight
    if (highlights.length > 0) {
      highlights[0].scrollIntoView({ behavior: 'smooth', block: 'center' });

  function buildDropdown(query) {
    if (!query || query.length < 2) {
      dropdown.classList.remove('open');

    var topics = getKBTopics();

    // Score sections
    sections.forEach(function(s) {

      if (sc > 0) results.push({ type: 'section', title: s.title, subtitle: 'Jump to section', id: s.id, el: s.el, score: sc });
    });

    // Score knowledge base topics
    topics.forEach(function(t) {
      var sc = score(query, t.title);
      t.keys.forEach(function(k) { sc = Math.max(sc, score(query, k)); });
      if (sc > 0) results.push({ type: 'topic', title: t.title, subtitle: t.ytLabel || 'Knowledge base topic', chapterId: t.chapterId, videoId: t.videoId, seconds: t.seconds, neetId: t.neetId, score: sc });

    } else if (e.key === 'Enter') {

    if (!e.target.closest('.smart-search-wrapper')) {

})();

          '<div style="margin-top:8px;font-size:0.75rem;color:#475569;">&#128161; Add a free Gemini API key in Settings to unlock streaming AI responses with gemini-2.0-flash.</div>';
      } else {
        bubble.innerHTML = 'I searched my notes but couldn\'t find a direct match for <em>"' + query + '"</em>. Try rephrasing or ask about a specific concept.<br><div style="margin-top:8px;font-size:0.75rem;color:#475569;">&#128161; Add a free Gemini API key in Settings to enable AI-powered answers.</div>';
      }
      if (c) { c.appendChild(bubble); c.scrollTop = c.scrollHeight; }
    }
    _processingChat = false;
  };

  // Also override handleChatSubmit for NeetCode which uses that function name
  if (window.handleChatSubmit !== undefined) {
    window.handleChatSubmit = async function(event) {
      if (event) event.preventDefault();
      await window.submitChat();
    };
  }

  // API Key save function
  window.saveApiKey = function() {
    var keyInput = document.getElementById('geminiApiKeyInput') || document.getElementById('api-key-input');
    if (!keyInput) return;
    var key = keyInput.value.trim();
    if (!key) return;
    localStorage.setItem('gemini_api_key', key);
    localStorage.setItem('neetcode_gemini_api_key', key);
    localStorage.setItem('os_gemini_key', key);
    var badge = document.getElementById('modelStatusBadge') || document.getElementById('rag-badge-text');
    if (badge) badge.textContent = 'gemini-2.0-flash Active';
    alert('API Key saved! Now using gemini-2.0-flash for streaming AI answers.');
  };

})();
</script>


<script id="placement-v3-runtime">
/* Master Runtime Controller: Sidebar, Chatbot RAG/LCEL, and Tabs */
function toggleSidebar() {
  const sidebar = document.querySelector('.chapter-sidebar') || document.querySelector('.sidebar');
  if (!sidebar) return;
  sidebar.classList.toggle('collapsed');
  const btn = document.getElementById('btn-toggle-sidebar');
  if (btn) {
    if (sidebar.classList.contains('collapsed')) {
      btn.classList.add('active');
      btn.innerHTML = '<span>☰</span> <span>Show Sidebar</span>';
    } else {
      btn.classList.remove('active');
      btn.innerHTML = '<span>☰</span> <span>Sidebar</span>';
    }
  }
}

let chatMode = 'strict';

function toggleChat(forceMinimize) {
  const dock = document.querySelector('.auxiliary-dock') || document.querySelector('.aux-dock');
  const pill = document.getElementById('chat-floating-pill');
  const btnNav = document.getElementById('btn-toggle-chat');
  if (!dock) return;

  if (forceMinimize === true || (!dock.classList.contains('minimized') && forceMinimize === undefined)) {
    dock.classList.add('minimized');
    if (pill) pill.classList.add('visible');
    if (btnNav) btnNav.classList.remove('active');
  } else {
    dock.classList.remove('minimized');
    if (pill) pill.classList.remove('visible');
    if (btnNav) btnNav.classList.add('active');
    const msgs = document.getElementById('chat-messages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }
}

function toggleChatWide() {
  const dock = document.querySelector('.auxiliary-dock') || document.querySelector('.aux-dock');
  const btn = document.getElementById('btn-chat-resize');
  if (!dock) return;
  dock.classList.toggle('wide');
  if (btn) {
    btn.textContent = dock.classList.contains('wide') ? '⤦' : '⛶';
  }
}

function setChatMode(mode) {
  chatMode = mode;
  const btnRag = document.getElementById('btn-mode-rag');
  const btnLcel = document.getElementById('btn-mode-lcel');
  const badge = document.getElementById('chat-pill-mode-badge');

  if (mode === 'strict') {
    if (btnRag) btnRag.classList.add('active');
    if (btnLcel) btnLcel.classList.remove('active');
    if (badge) badge.textContent = 'Strict RAG';
    appendAssistantMessage(" Switched to <strong>Strict Doc RAG Mode</strong>. Responses are strictly grounded in this guide with exact citations and timestamps.");
  } else {
    if (btnRag) btnRag.classList.remove('active');
    if (btnLcel) btnLcel.classList.add('active');
    if (badge) badge.textContent = 'LCEL Pipeline';
    appendAssistantMessage(" Switched to <strong>LCEL Open Pipeline Mode</strong>. The assistant will now provide deep generative conceptual synthesis, interview edge cases, and code implementations trained across the full domain.");
  }
}

function handleSearchInput(e) {
  const query = e.target.value.trim().toLowerCase();
  const dropdown = document.getElementById('smart-ac-dropdown');
  if (!dropdown) return;

  if (query.length < 2) {
    dropdown.style.display = 'none';
    return;
  }

  const results = [];
  document.querySelectorAll('.chapter-container, .chapter-header, h2, h3, .piq-card, article').forEach(el => {
    const text = el.innerText || '';
    if (text.toLowerCase().includes(query)) {
      const title = el.querySelector('h1, h2, h3, .chapter-title, .piq-q-text') ? 
                    (el.querySelector('h1, h2, h3, .chapter-title, .piq-q-text').innerText) : 
                    text.split('\n')[0].substring(0, 60);
      results.push({
        title: title.trim(),
        el: el
      });
    }
  });

  if (results.length === 0) {
    dropdown.innerHTML = '<div style="padding:10px 14px; font-size:0.8rem; color:#64748B;">No matching sections found</div>';
    dropdown.style.display = 'block';
    return;
  }

  dropdown.innerHTML = results.slice(0, 7).map((r, i) => `
    <div class="ac-item" onclick="jumpToSearchResult(${i})" style="padding:8px 12px; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:space-between; gap:10px; transition:background 0.15s;">
      <span style="font-size:0.82rem; font-weight:600; color:#E2E8F0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${r.title}</span>
      <span style="font-size:0.68rem; background:rgba(59,130,246,0.2); color:#60A5FA; padding:2px 6px; border-radius:4px; flex-shrink:0;">Jump &rarr;</span>
    </div>
  `).join('');
  dropdown.style.display = 'block';

  window._currentSearchResults = results;
}

function jumpToSearchResult(index) {
  if (!window._currentSearchResults || !window._currentSearchResults[index]) return;
  const target = window._currentSearchResults[index].el;
  const dropdown = document.getElementById('smart-ac-dropdown');
  if (dropdown) dropdown.style.display = 'none';

  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    target.style.outline = '2px solid #3B82F6';
    setTimeout(() => target.style.outline = 'none', 2000);
  }
}

document.addEventListener('click', function(e) {
  const searchWrap = document.querySelector('.nav-search-bar') || document.querySelector('.nav-center');
  const dropdown = document.getElementById('smart-ac-dropdown');
  if (dropdown && searchWrap && !searchWrap.contains(e.target)) {
    dropdown.style.display = 'none';
  }
});

function appendAssistantMessage(htmlContent) {
  const msgs = document.getElementById('chat-messages');
  if (!msgs) return;
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble assistant';
  bubble.innerHTML = htmlContent;
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendUserMessage(text) {
  const msgs = document.getElementById('chat-messages');
  if (!msgs) return;
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble user';
  bubble.textContent = text;
  msgs.appendChild(bubble);
  msgs.scrollTop = msgs.scrollHeight;
}

function askQuestion(q) {
  const input = document.getElementById('chat-query') || document.getElementById('chatInput');
  if (input) {
    input.value = q;
    submitChat();
  }
}

function submitChat() {
  if (typeof handleChatSubmit === 'function') {
    handleChatSubmit();
    return;
  }
  const input = document.getElementById('chat-query') || document.getElementById('chatInput');
  if (!input) return;
  const query = input.value.trim();
  if (!query) return;

  if (typeof addUserMessage === 'function') addUserMessage(query);
  input.value = '';

  if (typeof handleOfflineRagCall === 'function') {
    handleOfflineRagCall(query);
  }
}

function switchPiqTab(tab) {
  const tabSub = document.getElementById('piq-tab-subject') || document.getElementById('piq-tab-os');
  const tabDsa = document.getElementById('piq-tab-dsa');
  const gridSub = document.getElementById('piq-grid-subject') || document.getElementById('piq-grid-os');
  const gridDsa = document.getElementById('piq-grid-dsa');

  if (tab === 'subject' || tab === 'os') {
    if (tabSub) tabSub.classList.add('active');
    if (tabDsa) tabDsa.classList.remove('active');
    if (gridSub) gridSub.style.display = 'flex';
    if (gridDsa) gridDsa.style.display = 'none';
  } else {
    if (tabSub) tabSub.classList.remove('active');
    if (tabDsa) tabDsa.classList.add('active');
    if (gridSub) gridSub.style.display = 'none';
    if (gridDsa) gridDsa.style.display = 'flex';
  }
}

function togglePiqCard(cardEl) {
  cardEl.classList.toggle('open');
}
</script>


<script id="placement-mobile-runtime">
/* ══════════════════════════════════════════════════════════════════════════
   MOBILE & FOLDABLE RUNTIME ENGINE: Off-Canvas Sidebar + Bottom Sheet Chat
   ══════════════════════════════════════════════════════════════════════════ */

(function initMobileResponsiveEngine() {
  // 1. Create or get backdrop element
  let backdrop = document.getElementById('mobile-drawer-backdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'mobile-drawer-backdrop';
    backdrop.className = 'mobile-drawer-backdrop';
    document.body.appendChild(backdrop);
  }

  // 2. Add mobile close button to sidebar header if not present
  const sidebar = document.querySelector('.chapter-sidebar') || document.querySelector('.sidebar');
  if (sidebar) {
    let headerRow = sidebar.querySelector('.sidebar-header-row') || sidebar.querySelector('.sidebar-header');
    if (headerRow && !sidebar.querySelector('.sidebar-close-mobile-btn')) {
      const closeBtn = document.createElement('button');
      closeBtn.className = 'sidebar-close-mobile-btn';
      closeBtn.innerHTML = '&times;';
      closeBtn.title = 'Close Outline';
      closeBtn.onclick = function(e) {
        e.stopPropagation();
        closeMobileSidebar();
      };
      headerRow.appendChild(closeBtn);
    }

    // Auto-close sidebar on mobile when any link inside is tapped
    sidebar.querySelectorAll('a, .sidebar-link, .sidebar-pill, [onclick*="jump"]').forEach(link => {
      link.addEventListener('click', function() {
        if (window.innerWidth <= 992) {
          closeMobileSidebar();
        }
      });
    });
  }

  // 3. Setup Backdrop click listener
  backdrop.addEventListener('click', function() {
    closeMobileSidebar();
    closeMobileChat();
  });

  // 4. Overwrite / Enhance toggleSidebar for both desktop and mobile
  window.toggleSidebar = function() {
    const sb = document.querySelector('.chapter-sidebar') || document.querySelector('.sidebar');
    const bd = document.getElementById('mobile-drawer-backdrop');
    if (!sb) return;

    if (window.innerWidth <= 992) {
      // Mobile off-canvas toggle
      const isOpen = sb.classList.contains('mobile-open');
      if (isOpen) {
        closeMobileSidebar();
      } else {
        sb.classList.add('mobile-open');
        if (bd) bd.classList.add('active');
        closeMobileChat(); // ensure chat is closed when opening sidebar
      }
    } else {
      // Desktop collapse / expand
      sb.classList.toggle('collapsed');
      const btn = document.getElementById('btn-toggle-sidebar');
      if (btn) {
        if (sb.classList.contains('collapsed')) {
          btn.classList.add('active');
          btn.innerHTML = '<span>☰</span> <span>Show Sidebar</span>';
        } else {
          btn.classList.remove('active');
          btn.innerHTML = '<span>☰</span> <span>Sidebar</span>';
        }
      }
    }
  };

  window.closeMobileSidebar = function() {
    const sb = document.querySelector('.chapter-sidebar') || document.querySelector('.sidebar');
    const bd = document.getElementById('mobile-drawer-backdrop');
    if (sb) sb.classList.remove('mobile-open');
    if (bd && !document.querySelector('.auxiliary-dock.mobile-open, .aux-dock.mobile-open')) {
      bd.classList.remove('active');
    }
  };

  // 5. Overwrite / Enhance toggleChat for both desktop and mobile
  window.toggleChat = function(forceMinimize) {
    const dock = document.querySelector('.auxiliary-dock') || document.querySelector('.aux-dock');
    const pill = document.getElementById('chat-floating-pill');
    const bd = document.getElementById('mobile-drawer-backdrop');
    const btnNav = document.getElementById('btn-toggle-chat');
    if (!dock) return;

    if (window.innerWidth <= 992) {
      // Mobile bottom sheet toggle
      const isOpen = dock.classList.contains('mobile-open');
      if (forceMinimize === true || (isOpen && forceMinimize === undefined)) {
        closeMobileChat();
      } else {
        dock.classList.add('mobile-open');
        dock.classList.remove('minimized');
        if (bd) bd.classList.add('active');
        if (pill) pill.classList.remove('visible');
        if (btnNav) btnNav.classList.add('active');
        closeMobileSidebar();
        // scroll chat messages to bottom
        const msgs = document.getElementById('chat-messages');
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      }
    } else {
      // Desktop minimize / restore
      if (forceMinimize === true || (!dock.classList.contains('minimized') && forceMinimize === undefined)) {
        dock.classList.add('minimized');
        if (pill) pill.classList.add('visible');
        if (btnNav) btnNav.classList.remove('active');
      } else {
        dock.classList.remove('minimized');
        if (pill) pill.classList.remove('visible');
        if (btnNav) btnNav.classList.add('active');
        const msgs = document.getElementById('chat-messages');
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      }
    }
  };

  window.closeMobileChat = function() {
    const dock = document.querySelector('.auxiliary-dock') || document.querySelector('.aux-dock');
    const pill = document.getElementById('chat-floating-pill');
    const bd = document.getElementById('mobile-drawer-backdrop');
    const btnNav = document.getElementById('btn-toggle-chat');
    if (dock) {
      dock.classList.remove('mobile-open');
      dock.classList.add('minimized');
    }
    if (pill) pill.classList.add('visible');
    if (btnNav) btnNav.classList.remove('active');
    if (bd && !document.querySelector('.chapter-sidebar.mobile-open, .sidebar.mobile-open')) {
      bd.classList.remove('active');
    }
  };

  // 6. On initial load on mobile devices, ensure chat starts minimized and floating pill is ready
  function checkInitialViewport() {
    const pill = document.getElementById('chat-floating-pill');
    const dock = document.querySelector('.auxiliary-dock') || document.querySelector('.aux-dock');
    if (window.innerWidth <= 992) {
      if (dock) dock.classList.add('minimized');
      if (pill) pill.classList.add('visible');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkInitialViewport);
  } else {
    checkInitialViewport();
  }

  window.addEventListener('resize', function() {
    const pill = document.getElementById('chat-floating-pill');
    const dock = document.querySelector('.auxiliary-dock') || document.querySelector('.aux-dock');
    if (window.innerWidth > 992) {
      closeMobileSidebar();
      const bd = document.getElementById('mobile-drawer-backdrop');
      if (bd) bd.classList.remove('active');
    }
  });
})();
</script>
